name: Validate Phrygian corpus
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/replay_reference.py --check
      - run: python scripts/reconcile_g12.py --check
      - run: python scripts/audit_g12_reference_fingerprint.py --check
      - run: python scripts/audit_explicit_source_lineage.py --check
      - run: python scripts/reconcile_new_primary.py --check
      - run: python scripts/audit_titus_identity_units.py --check
      - run: python scripts/audit_titus_heading_hierarchy.py --check
